name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder values so `vite build` can inline import.meta.env without secrets.
      # Real values are injected as Docker build args by deploy.yml / fly-pr-preview.yml.
      VITE_SUPABASE_URL: https://ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-anon-key
      VITE_BASE_URL: https://ci.invalid
      VITE_AUTH_REDIRECT_URL: /search
      VITE_AUDIO_BASE_URL: https://ci.invalid
      VITE_LIVEBLOCKS_PUBKEY: pk_ci
      VITE_POSTHOG_KEY: ''
      VITE_POSTHOG_HOST: https://us.i.posthog.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:rules
      - run: npm test
      - run: npm run build
