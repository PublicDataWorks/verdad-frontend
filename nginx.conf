server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the SPA entrypoint. index.html references content-hashed
    # asset bundles (e.g. index-<hash>.js); if the browser serves a stale
    # index.html it points at an old bundle that no longer exists on the
    # origin. Without an explicit Cache-Control, browsers apply heuristic
    # caching and may skip revalidation. no-store forces a fresh fetch every
    # load so clients always pick up the current bundle immediately on deploy.
    #
    # `always` is required: this location also serves the `error_page 404`
    # fallback, and a request for a bundle the new build no longer has (e.g.
    # /assets/index-<old hash>.js) is answered from here with status 404.
    # Without `always`, add_header is skipped on 404 and that HTML body is
    # returned under a .js URL with no Cache-Control at all -- exactly the
    # response we must not let a browser cache.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain application/javascript text/css application/json text/xml application/xml application/xml+rss text/javascript;
}
